name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Check the tag is a semantic version
        run: |
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must be semantic versions like 1.2.3 or 1.2.3-beta.1, got '$VERSION'." >&2
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          if (( minor > 999 || patch > 999 )); then
            echo "Minor and patch must be below 1000 to fit the Android version code." >&2
            exit 1
          fi
          echo "VERSION_CODE=$(( major * 1000000 + minor * 1000 + patch ))" >> "$GITHUB_ENV"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Test
        run: |
          (cd relay && go test ./...)
          ./gradlew :app:testDebugUnitTest

      - name: Build relay
        working-directory: relay
        run: |
          mkdir -p dist
          for arch in arm64 amd64; do
            GOOS=darwin GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o dist/muxer ./cmd/muxer
            tar -C dist -czf "dist/muxer-${VERSION}-darwin-${arch}.tar.gz" muxer
            rm dist/muxer
          done

      - name: Build signed APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ vars.SIGNING_KEY_ALIAS }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ] || [ -z "$SIGNING_KEY_ALIAS" ]; then
            echo "Set the SIGNING_* secrets and the SIGNING_KEY_ALIAS variable to publish a signed APK." >&2
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/release.jks" ./gradlew :app:assembleRelease \
            -PversionName="$VERSION" -PversionCode="$VERSION_CODE"
          rm "$RUNNER_TEMP/release.jks"
          cp app/build/outputs/apk/release/app-release.apk "relay/dist/muxer-${VERSION}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "relay/dist/muxer-${VERSION}-mapping.txt"

      - name: Checksums
        working-directory: relay/dist
        run: shasum -a 256 * > SHA256SUMS

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" relay/dist/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Add update instructions to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          without() { awk -v name="$1" '$0 == "<!-- " name " -->" { skip = 1 } !skip { print } $0 == "<!-- /" name " -->" { skip = 0 }'; }
          body=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body | tr -d '\r')
          changelog=$(without update <<<"$body" | without virustotal | sed -e '/./,$!d')
          virustotal=$(awk '/^<!-- virustotal -->$/,/^<!-- \/virustotal -->$/' <<<"$body")
          {
            if [ -n "$changelog" ]; then printf '%s\n\n' "$changelog"; fi
            echo '<!-- update -->'
            packaging/release-notes/update-instructions.sh "$VERSION" "${flags[@]}"
            echo '<!-- /update -->'
            if [ -n "$virustotal" ]; then printf '\n%s\n' "$virustotal"; fi
          } > "$RUNNER_TEMP/notes.md"
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Get a token for the Homebrew tap
        id: tap-token
        if: ${{ !github.event.release.prerelease }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: gantoine
          repositories: homebrew-tap
          permission-contents: write

      - name: Update the Homebrew tap
        if: ${{ !github.event.release.prerelease }}
        env:
          TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
          APP_SLUG: ${{ steps.tap-token.outputs.app-slug }}
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/gantoine/homebrew-tap.git" "$RUNNER_TEMP/tap"
          bot_id=$(GH_TOKEN="$TAP_TOKEN" gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)

          checksum() { awk -v file="muxer-${VERSION}-darwin-$1.tar.gz" '$2 == file { print $1 }' relay/dist/SHA256SUMS; }
          arm64_sha=$(checksum arm64)
          amd64_sha=$(checksum amd64)
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          packaging/homebrew/render-formula.sh "$VERSION" "$arm64_sha" "$amd64_sha" > "$RUNNER_TEMP/tap/Formula/muxer.rb"

          cd "$RUNNER_TEMP/tap"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch Formula/cmux-relay.rb
          echo '{ "cmux-relay": "muxer" }' > formula_renames.json
          git add Formula/muxer.rb formula_renames.json
          if git diff --cached --quiet; then
            echo "The formula is already at ${VERSION}."
          else
            git commit -m "muxer ${VERSION}"
            git push origin HEAD:main
          fi

  virustotal:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Download the release files
        run: |
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.apk' --pattern '*.tar.gz' --dir "$RUNNER_TEMP/assets"

      - name: Scan with VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: packaging/virustotal/scan.sh "$RUNNER_TEMP"/assets/* > "$RUNNER_TEMP/virustotal.md"

      - name: Add the results to the release notes
        run: |
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body \
            | tr -d '\r' \
            | awk '/^<!-- virustotal -->$/ { skip = 1 } !skip { print } /^<!-- \/virustotal -->$/ { skip = 0 }' \
            | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > "$RUNNER_TEMP/notes.md"
          {
            echo
            echo '<!-- virustotal -->'
            cat "$RUNNER_TEMP/virustotal.md"
            echo '<!-- /virustotal -->'
          } >> "$RUNNER_TEMP/notes.md"
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
